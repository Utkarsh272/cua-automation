  route: /search
  postcondition: {title_contains: CU Core - Member Search}
- id: enter_member_id
  action: fill
  target:
    description: Member ID text box in 'Find Member'
    frame:
    - {name: main}
    strategies:
    - {by: label, text: Member ID, control: textbox}
    - {by: attribute, attr: name, value: ctl00$main$txtMid, tag: input}
    fingerprint:
      tag: input
      role: textbox
      near_text: Member ID
      row_context: ['Member ID:']
      attributes: {name: ctl00$main$txtMid, type: text}
      bbox: [325, 128, 93, 21]
  value: '{{inputs.member_id}}'
- id: click_search
  action: click
  target:
    description: Search button in 'Find Member'
    frame:
