app: {product: cu-core, versions: '>=4.6 <5'}

description: Open a new sub-account for a member, funded from one of their existing accounts.
risk: irreversible
subject: inputs.member_id

inputs:
  type: object
  required: [member_id, account_type, nickname, initial_deposit, funding_account]
  properties:
    member_id:
      type: string
      description: Five-digit member ID.
      x-sensitivity: identifier
      pattern: ^[0-9]{5}$
    account_type:
      type: string
      description: Type of the new sub-account, as shown in the Account Type dropdown.
      x-sensitivity: public
      enum: [Savings, Money Market, Certificate]
    nickname:
      type: string
      description: Nickname for the new account.
      x-sensitivity: public
      maxLength: 20
    initial_deposit:
      type: string
      description: Opening deposit in USD, digits only (for example [REDACTED:financial]).
      x-sensitivity: financial
      pattern: ^[0-9]+([.][0-9]{2})?$
    funding_account:
      type: string
      description: Account number the deposit is taken from.
      x-sensitivity: identifier
      pattern: ^[0-9]{4}-[0-9]{3}-[0-9]{4}$
  additionalProperties: false
outputs:
  type: object
  required: [new_account_number]
  properties:
    new_account_number:
      type: string
      description: Account number of the newly opened sub-account.
      x-sensitivity: identifier
  additionalProperties: false

outcomes:
- {code: MEMBER_NOT_FOUND, description: No member exists with this ID.}
- {code: ACCESS_DENIED, description: The service account may not act on this member.}
- {code: VALIDATION_ERROR, description: The application rejected the account details.}
requires: [login@^1]

