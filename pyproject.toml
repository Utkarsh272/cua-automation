[project]
name = "cua-automation"
version = "0.1.0"
description = "Computer-use automation: an LLM discovers a UI flow once, it is compiled into a versioned capability, and replayed deterministically with no model in the loop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Utkarsh Mittal" }]
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "structlog>=24.1",
    "playwright>=1.45",
    "anthropic>=0.34",
    "jsonschema>=4.22",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
cua = "cua.cli:app"
cu-core = "target_app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "target_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/cua/cli.py" = ["B008"]  # typer's Option(...) defaults are the documented idiom
"src/cua/operator/console.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["cua"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cua.core.*"
strict = true
