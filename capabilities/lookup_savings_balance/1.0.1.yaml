# lookup_savings_balance 1.0.1: reviewed patch of 1.0.0 (same steps and locators).
# - access_denied: matches 'is not authorized to view restricted member records' (1.0.0 quoted
#   the service-account name, so it would never fire for another credit union)
# - no_savings_account: new detector, the Savings row is absent (written by hand: the only page
#   hint for this case is member data, so discovery cannot learn it safely)
# - dismiss_system_notice: new recovery for the maintenance notice interstitial
# Behavior hash: sha256:357b3a6745923d90ded598d536971815b854ddfc3a12a8b1724364e18a60577e. Approve with `cua approve lookup_savings_balance 1.0.1 --by <you>`.
schema_version: 1
id: lookup_savings_balance
version: 1.0.1
content_hash: sha256:357b3a6745923d90ded598d536971815b854ddfc3a12a8b1724364e18a60577e
status: approved
recorded_by: review-patch (prepared with Claude; needs a human approver)
approved_by: utkarsh.mittal
approved_at: '2026-10-02T00:38:06+00:00'
provenance:
  origin: discovery
  recorded_from_run: discovery_2026-10-01T16-28-20Z_eb11
  model: groq/openai/gpt-oss-120b
  recorded_on_tenant: tenant-a
  recorded_at: '2026-10-01T16:28:20.948426Z'
  notes: 'Compiled from 3 discovery run(s): discovery_2026-10-01T16-28-20Z_eb11, discovery_2026-10-01T17-23-30Z_f4d4,
    discovery_2026-10-01T17-23-48Z_cd2e. 1.0.1 is a reviewed patch of 1.0.0: access_denied quote no longer includes
    the service-account name; NO_SAVINGS_ACCOUNT detector (Savings row absent) and System Notice recovery added
    by hand.'
app: {product: cu-core, versions: '>=4.6 <5'}

description: Look up a credit union member by member ID and return their name and current savings balance.
risk: read
subject: inputs.member_id

inputs:
  type: object
  required: [member_id]
  properties:
    member_id:
      type: string
      description: Five-digit member ID.
      x-sensitivity: identifier
      pattern: ^[0-9]{5}$
  additionalProperties: false
outputs:
  type: object
  required: [member_name, savings_balance]
  properties:
    member_name:
      type: string
      description: Member's full name as shown on the member record.
      x-sensitivity: pii
    savings_balance:
      type: number
      description: Current savings account balance in USD.
      x-sensitivity: financial
  additionalProperties: false

outcomes:
- {code: MEMBER_NOT_FOUND, description: No member exists with this ID.}
- code: ACCESS_DENIED
  description: The service account may not view this member (restricted record).
- {code: NO_SAVINGS_ACCOUNT, description: The member exists but has no savings account.}
requires: [login@^1]

steps:
- id: open_search
  action: navigate
  description: Start at /search (already signed on)
  frame:
  - {name: main}
  route: /search
  postcondition: {title_contains: CU Core - Member Search}
- id: enter_member_id
  action: fill
  target:
    description: Member ID text box
    frame:
    - {name: main}
    strategies:
    - {by: label, text: Member ID, control: textbox}
    - {by: attribute, attr: name, value: ctl00$main$txtMid, tag: input}
    fingerprint:
      tag: input
      role: textbox
      near_text: Member ID
      row_context: ['Member ID:']
      attributes: {name: ctl00$main$txtMid, type: text}
      bbox: [325, 128, 93, 21]
  value: '{{inputs.member_id}}'
- id: click_search
  action: click
  target:
    description: Search button
    frame:
    - {name: main}
    strategies:
    - {by: role, role: button, name: Search, near_text: Find Member}
    - {by: attribute, attr: name, value: ctl00$main$btnSearch, tag: input}
    fingerprint:
      tag: input
      role: button
      name: Search
      attributes: {name: ctl00$main$btnSearch, type: submit}
      bbox: [325, 159, 58, 21]
  wait:
    until:
      any_of:
      - {title_contains: CU Core - Member Detail}
      - {detector: member_not_found}
      - {detector: access_denied}
      - {detector: no_savings_account}
    timeout_ms: 8000
- id: read_member_name
  action: extract
  target:
    description: value next to 'Name'
    frame:
    - {name: main}
    strategies:
    - {by: label, text: Name, control: value_cell}
    fingerprint:
      tag: td
      role: cell
      near_text: Name
      row_context: ['Name:', 'Phone:']
      bbox: [319, 148, 107, 25]
  output: member_name
  parse: text
- id: read_savings_balance
  action: extract
  target:
    description: Balance of the 'Savings' row in the 'Accounts' table
    frame:
    - {name: main}
    strategies:
    - {by: table_cell, table_near: Accounts, row_match: Savings, column: Balance}
    fingerprint:
      tag: td
      role: cell
      row_context: [Savings, Open]
      bbox: [555, 282, 85, 25]
  output: savings_balance
  parse: currency_usd

detectors:
- id: member_not_found
  when: {text_visible: No member found for the ID entered.}
  then: {outcome: MEMBER_NOT_FOUND}
- id: access_denied
  when: {text_visible: is not authorized to view restricted member records}
  then: {outcome: ACCESS_DENIED}
- id: no_savings_account
  when:
    all_of:
    - {title_contains: Member Detail}
    - not:
        element:
          description: Savings row in the Accounts table
          frame:
          - {name: main}
          strategies:
          - {by: table_cell, table_near: Accounts, row_match: Savings, column: Account}
  then: {outcome: NO_SAVINGS_ACCOUNT}
- id: dismiss_system_notice
  when: {dialog_title: System Notice}
  then:
    recover: click
    target:
      description: Acknowledge button on the System Notice
      frame:
      - {name: main}
      strategies:
      - {by: role, role: button, name: Acknowledge}
    max: 2

success:
  all_of:
  - {title_contains: CU Core - Member Detail}
  - {output_present: member_name}
  - {output_present: savings_balance}
