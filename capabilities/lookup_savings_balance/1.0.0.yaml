app: {product: cu-core, versions: '>=4.6 <5'}

description: Look up a credit union member by member ID and return their name and current savings balance.
risk: read
subject: inputs.member_id

inputs:
  type: object
  required: [member_id]
  properties:
    member_id:
      type: string
      description: Five-digit member ID.
      x-sensitivity: identifier
      pattern: ^[0-9]{5}$
  additionalProperties: false
outputs:
  type: object
  required: [member_name, savings_balance]
  properties:
    member_name:
      type: string
      description: Member's full name as shown on the member record.
      x-sensitivity: pii
    savings_balance:
      type: number
      description: Current savings account balance in USD.
      x-sensitivity: financial
  additionalProperties: false

outcomes:
- {code: MEMBER_NOT_FOUND, description: No member exists with this ID.}
- code: ACCESS_DENIED
  description: The service account may not view this member (restricted record).
- {code: NO_SAVINGS_ACCOUNT, description: The member exists but has no savings account.}
requires: [login@^1]

steps:
- id: open_search
  action: navigate
  description: Start at /search (already signed on)
  frame:
  - {name: main}
  route: /search
  postcondition: {title_contains: CU Core - Member Search}
- id: enter_member_id
  action: fill
  target:
    description: Member ID text box
    frame:
    - {name: main}
    strategies:
    - {by: label, text: Member ID, control: textbox}
    - {by: attribute, attr: name, value: ctl00$main$txtMid, tag: input}
    fingerprint:
      tag: input
      role: textbox
      near_text: Member ID
      row_context: ['Member ID:']
      attributes: {name: ctl00$main$txtMid, type: text}
      bbox: [325, 128, 93, 21]
  value: '{{inputs.member_id}}'
- id: click_search
  action: click
  target:
    description: Search button
    frame:
    - {name: main}
    strategies:
    - {by: role, role: button, name: Search, near_text: Find Member}
    - {by: attribute, attr: name, value: ctl00$main$btnSearch, tag: input}
    fingerprint:
      tag: input
      role: button
      name: Search
      attributes: {name: ctl00$main$btnSearch, type: submit}
      bbox: [325, 159, 58, 21]
  wait:
    until:
      any_of:
      - {title_contains: CU Core - Member Detail}
      - {detector: member_not_found}
      - {detector: access_denied}
    timeout_ms: 8000
- id: read_member_name
  action: extract
  target:
    description: value next to 'Name'
    frame:
    - {name: main}
    strategies:
    - {by: label, text: Name, control: value_cell}
    fingerprint:
      tag: td
      role: cell
      near_text: Name
      row_context: ['Name:', 'Phone:']
      bbox: [319, 148, 107, 25]
  output: member_name
  parse: text
- id: read_savings_balance
  action: extract
  target:
    description: Balance of the 'Savings' row in the 'Accounts' table
    frame:
    - {name: main}
    strategies:
    - {by: table_cell, table_near: Accounts, row_match: Savings, column: Balance}
    fingerprint:
      tag: td
      role: cell
      row_context: [Savings, Open]
      bbox: [555, 282, 85, 25]
  output: savings_balance
  parse: currency_usd

detectors:
- id: member_not_found
  when: {text_visible: No member found for the ID entered.}
  then: {outcome: MEMBER_NOT_FOUND}
- id: access_denied
  when:
    text_visible: Access Denied. Your user profile (SVC_AUTOMATION) is not authorized to view restricted 
      member records.
  then: {outcome: ACCESS_DENIED}

success:
  all_of:
  - {title_contains: CU Core - Member Detail}
  - {output_present: member_name}
  - {output_present: savings_balance}
