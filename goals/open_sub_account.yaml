# Discovery spec for a WRITE capability. The last step (Confirm) is irreversible, so discovery
# pauses there and an operator approves it, or does it by hand, in the operator console.
capability_id: open_sub_account
description: Open a new sub-account for a member, funded from one of their existing accounts.

goal: >
  Find the member whose member ID is {{inputs.member_id}}, open a new sub-account of type
  {{inputs.account_type}} with nickname {{inputs.nickname}} and an initial deposit of
  {{inputs.initial_deposit}} funded from account {{inputs.funding_account}}, complete the
  application, and read the new account number.

tenant: tenant-a
start_route: /search
risk_ceiling: irreversible    # writes allowed; irreversible actions still always need a human
max_steps: 25
max_minutes: 20

inputs:
  type: object
  required: [member_id, account_type, nickname, initial_deposit, funding_account]
  properties:
    member_id:
      type: string
      pattern: "^[0-9]{5}$"
      description: Five-digit member ID.
      x-sensitivity: identifier
    account_type:
      type: string
      enum: [Savings, Money Market, Certificate]
      description: Type of the new sub-account, as shown in the Account Type dropdown.
      x-sensitivity: public
    nickname:
      type: string
      maxLength: 20
      description: Nickname for the new account.
      x-sensitivity: public
    initial_deposit:
      type: string
      pattern: "^[0-9]+([.][0-9]{2})?$"
      description: Opening deposit in USD, digits only (for example 250.00).
      x-sensitivity: financial
    funding_account:
      type: string
      pattern: "^[0-9]{4}-[0-9]{3}-[0-9]{4}$"
      description: Account number the deposit is taken from.
      x-sensitivity: identifier

outputs:
  type: object
  required: [new_account_number]
  properties:
    new_account_number:
      type: string
      description: Account number of the newly opened sub-account.
      x-sensitivity: identifier

subject: inputs.member_id

outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member exists with this ID.
  - code: ACCESS_DENIED
    description: The service account may not act on this member.
  - code: VALIDATION_ERROR
    description: The application rejected the account details.

hints:
  - Every form value is an input. Type placeholders such as {{inputs.nickname}}, never real values.
  - In dropdowns, pass the input placeholder as the option, for example {{inputs.funding_account}}.
  - The final Confirm button is expected. Click it; a human approves it before anything is committed.

example_inputs:
  member_id: "10042"
  account_type: Savings
  nickname: Vacation
  initial_deposit: "250.00"
  funding_account: 0042-001-7731
